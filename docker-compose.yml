services:

  autobuilder:
    image: autobuilder:latest
    container_name: autobuilder
    restart: always
    pull_policy: never
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deployments:/app/deployments:ro
      - ./data/repos:/app/repos
    environment:
      - COMPOSE_PROJECT_NAME=${PROJECT_NAME:-localai}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
      - DEPLOYMENTS_HOST_PATH=${DEPLOYMENTS_HOST_PATH:-}
